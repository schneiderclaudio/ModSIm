[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modsim"
version = "0.1.0"
description = "Mineral processing plant simulator GUI (PySide6 rewrite)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
# matplotlib is used as a fallback for plot types Qt Charts does not support well.
plotting = ["matplotlib>=3.7"]

[project.scripts]
modsim = "modsim.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modsim*"]

[tool.setuptools.package-data]
modsim = ["py.typed"]
